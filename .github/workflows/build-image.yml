# Builds upstream's Dockerfile for the patched v17.0.1 branch and publishes it
# to ghcr.io. Each platform is built natively on its own GitHub-hosted runner,
# then the per-platform images are joined into one multi-arch tag.
#
# Forgejo's own CI lives in .forgejo/workflows, which GitHub ignores.
name: build-image

on:
  push:
    branches:
      - v17.0.1-cleanup-fix
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/forgejo
  # Bump the suffix for every rebuild with a changed patch set.
  PATCH_VERSION: 17.0.1-cleanupfix.1

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          # the Makefile derives the version from `git describe --tags`
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            RELEASE_VERSION=${{ env.PATCH_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Check the version string
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint /app/gitea/gitea \
            ${{ env.IMAGE }}@${{ steps.build.outputs.digest }} --version

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
          echo "${{ matrix.platform }} $digest" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$PATCH_VERSION" \
            -t "$IMAGE:$GITHUB_SHA" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect "$IMAGE:$PATCH_VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
